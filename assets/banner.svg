<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030c15"/><stop offset=".56" stop-color="#071622"/><stop offset="1" stop-color="#02080e"/>
    </linearGradient>
    <radialGradient id="glow" cx=".53" cy="-.1" r=".7">
      <stop offset="0" stop-color="#1f6278" stop-opacity=".35"/><stop offset="1" stop-color="#1f6278" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#66d7ef" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridmask"><rect width="1200" height="300" fill="url(#fade)"/></mask>
    <style>
      .tw { animation: tw 4s ease-in-out infinite; }
      .d1 { animation-delay: 1.1s } .d2 { animation-delay: 2.3s } .d3 { animation-delay: 3.2s }
      @keyframes tw { 50% { opacity: .2 } }
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#glow)"/>
  <rect y="120" width="1200" height="180" fill="url(#grid)" mask="url(#gridmask)"/>
  <circle cx="660" cy="330" r="300" fill="none" stroke="#5ccbe3" stroke-opacity=".08"/>
  <circle cx="660" cy="330" r="220" fill="none" stroke="#5ccbe3" stroke-opacity=".05"/>
  <g fill="#b6edf4">
    <circle class="tw" cx="880" cy="46" r="1.4"/><circle class="tw d1" cx="1040" cy="120" r="1.1"/>
    <circle class="tw d2" cx="760" cy="84" r="1"/><circle class="tw d3" cx="1130" cy="60" r="1.3"/>
    <circle class="tw d1" cx="960" cy="200" r="1"/><circle class="tw d2" cx="1100" cy="236" r="1.2"/>
    <circle class="tw" cx="700" cy="170" r=".9"/><circle class="tw d3" cx="830" cy="250" r="1.1"/>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="14" fill="none" stroke="#7cc2d6" stroke-opacity=".22"/>
  <rect x="56" y="1" width="60" height="2" fill="#83def4"/>
  <!-- sigil -->
  <g transform="translate(64 64)">
    <rect width="40" height="40" fill="none" stroke="#85e2f0" stroke-opacity=".7"/>
    <rect x="8" y="8" width="24" height="24" fill="none" stroke="#7bdcef" stroke-opacity=".5"/>
    <rect x="16" y="16" width="8" height="8" fill="#83def4"/>
    <path d="M-6 20H46M20 -6V46" stroke="#83def4" stroke-opacity=".35"/>
  </g>
  <text x="124" y="82" class="mono" font-size="12" font-weight="700" letter-spacing="3" fill="#83cddd">PORTFOLIO // OBSERVATORY</text>
  <text x="124" y="102" class="mono" font-size="11" letter-spacing="2" fill="#8fb1be">TOKYO, JP</text>
  <text x="62" y="186" class="sans" font-size="64" font-weight="800" letter-spacing="6" fill="#f1fcff">MAITO SASAKI</text>
  <text x="64" y="226" class="mono" font-size="17" fill="#83def4"><tspan fill="#78dec5">&gt;</tspan> Computer Vision / Novel View Synthesis / 3D Reconstruction</text>
  <text x="64" y="258" class="mono" font-size="13" letter-spacing="1" fill="#9dbbc5">M1 @ Tokyo University of Technology  ·  AI Engineer @ neoAI  ·  NVIDIA Student Ambassador</text>
</svg>
